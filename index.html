<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de gorjeta</title>
</head>
<body>
   
    <header>
        <img src="./calculadora-de-gorjeta_base/images/logo.svg" alt="Logo do Spliter">
    </header>
    
    <main>

        <section class="informacoes">
            <form action="">

                <div class="conta">

                    <label for="">Conta</label>

                    <div><img src="./calculadora-de-gorjeta_base/images/icon-dollar.svg" alt=""></div>
                    <input type="number" name="conta" id="conta">

                </div>
                
                <div class="gorjeta">
                    <label for="outra">Selecione a gorjeta %</label>
                    <div>
                        <input type="button" value="5%">
                        <input type="button" value="10%">
                        <input type="button" value="15%" >
                        <input type="button" value="25%">
                        <input type="button" value="50%">
                        <input type="number" name="outra" id="outra">
                    </div>


                </div>
            </form>

        </section>


    </main>

</body>
</html>
